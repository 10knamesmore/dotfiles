[package]
name         = "agent-hooks"
description  = "多个 coding agent 共用的本地 hook 规则引擎"
version      = "0.1.0"
edition      = "2024"
license      = "MIT"
authors      = ["wanger <310779211wym@gmail.com>"]
rust-version = "1.85"

[[bin]]
name = "agent-hook"
path = "src/main.rs"

[dependencies]
clap       = { version = "4", features = ["derive"] }
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml       = "0.8"
shlex      = "1"
regex-lite = "0.1"
globset    = "0.4"

[dev-dependencies]
assert_cmd = "2"
tempfile   = "3"
proptest   = "1"

[lints.rust]
unsafe_code  = "deny"
missing_docs = "deny"

[lints.clippy]
panic                         = "deny"
unwrap_used                   = "deny"
expect_used                   = "deny"
too_many_lines                = "deny"
wildcard_imports              = "deny"
use_self                      = "deny"
missing_docs_in_private_items = "deny"
min_ident_chars               = "deny"
