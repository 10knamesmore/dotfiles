[package]
name = "desktop-backend"
version = "0.1.0"
edition = "2024"
description = "Linux desktop services for the Quickshell configuration"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["bmp", "png"] }
nix = { version = "0.31", features = ["feature", "fs", "process", "signal"] }
procfs = { version = "0.18", default-features = false }
regex-lite = "0.1"
rtnetlink = "0.23"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[lints.rust]
unsafe_code = "deny"
