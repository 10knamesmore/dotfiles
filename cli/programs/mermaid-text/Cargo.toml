[package]
name = "mermaid-text"
version = "0.1.0"
edition = "2024"
description = "Render Mermaid diagrams as terminal text, Kitty graphics, or PNG"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "env"] }
cosmic-text = "0.19"
csscolorparser = "0.8"
kurbo = "0.13"
rustc-hash = "2"
rustix = { version = "1", features = ["termios"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
svgtypes = "0.16"
tiny-skia = "0.11"
unicode-segmentation = "1"
unicode-width = "0.2"
yaml_serde = "0.10"
