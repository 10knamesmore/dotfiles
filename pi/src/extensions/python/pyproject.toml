[project]
name = "pi-python-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8.0",
    "browser-use-sdk",
    "computer-use-sdk; sys_platform == 'linux'",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openai>=3.19.2",
    "pillow>=12.3.0",
    "pi-display-image-sdk",
    "psutil>=7.2.2",
    "rapidfuzz>=3.14.6",
    "regex>=2026.9.10",
    "requests>=2.34.2",
    "terminal-use-sdk",
    "tiktoken>=0.14.0",
    "tree-sitter-language-pack>=1.20.0",
]

[tool.uv]
package = false

[tool.uv.sources]
browser-use-sdk = { path = "packages/browser-use", editable = true }
computer-use-sdk = { path = "packages/computer-use" }
pi-display-image-sdk = { path = "packages/pi-display-image" }
terminal-use-sdk = { path = "packages/terminal-use" }
