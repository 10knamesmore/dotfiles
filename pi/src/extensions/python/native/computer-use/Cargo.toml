[package]
name = "computer-use-sdk"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Linux Hyprland computer-use SDK for Pi's Python worker"

[lib]
name = "computer_use"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.29.2", default-features = false, features = ["macros", "abi3-py312", "extension-module"] }
pythonize = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
wayland-client = "0.31.14"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
xkbcommon = { version = "0.9", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"

[package.metadata.maturin]
bindings = "pyo3"
module-name = "computer_use"
