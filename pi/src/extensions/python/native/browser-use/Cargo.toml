[package]
name = "browser-use-sdk"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Chromium browser-use SDK for Pi's Python worker"

[lib]
name = "browser_use"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.29.2", default-features = false, features = ["macros", "abi3-py312", "extension-module"] }
pythonize = "0.29"
chromiumoxide = { version = "0.9.1", default-features = false }
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
anyhow = "1"
base64 = "0.22"
globset = "0.4"
tempfile = "3"
libc = "0.2"
