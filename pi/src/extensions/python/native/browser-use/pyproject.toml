[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "browser-use-sdk"
version = "0.1.0"
description = "Native Chromium browser control for Pi's Python worker"
requires-python = ">=3.12"
classifiers = ["Programming Language :: Rust", "Operating System :: POSIX :: Linux", "Operating System :: MacOS"]

[tool.maturin]
bindings = "pyo3"
module-name = "browser_use"
locked = true

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
    { file = "src/**/*.js" },
]
