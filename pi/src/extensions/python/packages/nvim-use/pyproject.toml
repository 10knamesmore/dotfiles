[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "nvim-use-sdk"
version = "0.1.0"
description = "Native Neovim and LSP access for Pi's Python worker"
requires-python = ">=3.12"
dependencies = ["pynvim>=0.6.0", "psutil>=7.2.2"]

[tool.uv.build-backend]
module-name = "nvim_use"
