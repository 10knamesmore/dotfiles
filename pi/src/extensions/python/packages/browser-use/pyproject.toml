[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "browser-use-sdk"
version = "0.1.0"
description = "Playwright browser sessions integrated with Pi's Python worker"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.63.0",
    "psutil>=7.2.2",
]

[tool.uv.build-backend]
module-name = "browser_use"
