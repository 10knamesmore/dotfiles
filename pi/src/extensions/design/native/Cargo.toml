[package]
name = "pi-design-sdk"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local design service and Python SDK for Pi"

[lib]
name = "pi_design"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["json", "query"] }
fs2 = "0.4"
json-patch = "4"
notify = "8"
nix = { version = "0.31", features = ["signal", "process"] }
pyo3 = { version = "=0.29.2", default-features = false, features = ["macros", "abi3-py312"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "process", "time", "macros", "io-util"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
uuid = { version = "1", features = ["v5"] }

[features]
default = ["python-extension"]
python-extension = ["pyo3/extension-module"]

[package.metadata.maturin]
bindings = "pyo3"
module-name = "pi_design"
features = ["python-extension"]
