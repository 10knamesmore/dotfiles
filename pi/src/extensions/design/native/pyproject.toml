[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pi-design-sdk"
version = "0.1.0"
description = "Local design service and Python SDK for Pi"
requires-python = ">=3.12"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
]

[tool.maturin]
bindings = "pyo3"
module-name = "pi_design"
features = ["python-extension"]
locked = true

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]
