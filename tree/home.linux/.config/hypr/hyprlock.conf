$font = Hack Nerd Font

source = $HOME/.local/state/dots/theme/hyprlock.conf

# GENERAL
general {
    hide_cursor = false
    ignore_empty_input = true
}

background {
    monitor = eDP-1
    path = screenshot
    color = rgba(0,0,0,1.0)
    blur_passes = 3
    brightness = 0.32
    blur_size = 8
    crossfade_time = 0.6
}

background {
    monitor = DP-3
    path = screenshot
    color = rgba(0,0,0,1.0)
    blur_passes = 3
    brightness = 0.32
    blur_size = 8
    crossfade_time = 0.6
}

# TIME
label {
  text = $TIME
  color = $text
  font_size = 96
  font_family = $font
  position = 0, -150
  halign = center
  valign = top
}

# DATE
label {
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $subtext1
  font_size = 20
  font_family = $font
  position = 0, -325
  halign = center
  valign = top
}

# USER AVATAR
image {
  path = $HOME/Pictures/avatar.jpg
  size = 104
  rounding = -1
  border_size = 3
  border_color = $mauve
  position = 0, 75
  halign = center
  valign = center
}

input-field {
    size = 220, 48
    outline_thickness = 2
    dots_size = 0.35
    dots_spacing = 0.2
    inner_color = $input_background
    outer_color = $surface1
    check_color = $mauve
    fail_color = $red

    fail_text = 

    font_color = $text
    fade_on_empty = true
    rounding = 16

    placeholder_text = 󰌾

    position = 0, -20
    halign = center
    valign = center
}
