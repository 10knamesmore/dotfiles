# 由主 hypridle 在锁定时启动、解锁时终止，15 秒从锁定后开始计时。
general {
    ignore_dbus_inhibit = true
    ignore_systemd_inhibit = true
    ignore_wayland_inhibit = true
    inhibit_sleep = 0
}

listener {
    timeout = 15
    on-timeout = ~/dotfiles/.gen/scripts/hypr/screen_effects.sh dim
    on-resume = ~/dotfiles/.gen/scripts/hypr/screen_effects.sh undim
}
