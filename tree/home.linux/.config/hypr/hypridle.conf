# =====================
# Hypridle 配置
# =====================

# 别把 pidof 列表里加回 quickshell/qs：bar 常驻会让 `|| hyprlock` 永不触发 → suspend 不锁屏
$lock_cmd = pidof hyprlock || hyprlock
$suspend_cmd = systemctl suspend || loginctl suspend
# 全局设置
general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    inhibit_sleep = 3
}

listener {
    timeout = 540                                 # 9min — 锁屏前 1 分钟降低亮度预警
    on-timeout = brightnessctl -d amdgpu_bl1 -s set 10%
    on-resume = brightnessctl -d amdgpu_bl1 -r
}

listener {
    timeout = 600                                 # 10min
    on-timeout = hyprlock            # lock screen when timeout has passed
}

listener {
    timeout = 1200                                                     # 20min
    on-timeout = hyprctl dispatch dpms off                            # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on && brightnessctl -d amdgpu_bl1 -r          # screen on when activity is detected after timeout has fired.
}
