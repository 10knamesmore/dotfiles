keymap:
  - name: Kitty clipboard
    application:
      only: [kitty]
    exact_match: true
    remap:
      Super-c: Ctrl-Shift-c
      Super-v: Ctrl-Shift-v

  - name: GUI clipboard and selection
    application:
      not: [kitty]
    exact_match: true
    remap:
      Super-c: Ctrl-c
      Super-v: Ctrl-v
      Super-a: Ctrl-a
