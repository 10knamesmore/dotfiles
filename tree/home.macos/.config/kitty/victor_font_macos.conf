# BEGIN_KITTY_FONTS
font_family      family='Victor Mono' postscript_name=VictorMono-ExtraLight
bold_font        family='Victor Mono' style='Medium Oblique'
italic_font      family='Victor Mono' style='ExtraLight Italic'
bold_italic_font family='Victor Mono' style='Medium Italic'
# END_KITTY_FONTS

# CJK/假名 → Maple Mono NF CN：Victor Mono 无这些字形，symbol_map 钉死。
# 汉字 4E00-9FFF + CJK标点 3000-303F + 全角 FF00-FFEF + 平假名 3040-309F + 片假名 30A0-30FF。
symbol_map U+4E00-U+9FFF,U+3000-U+303F,U+FF00-U+FFEF,U+3040-U+309F,U+30A0-U+30FF PingFang SC
