# Kimi Code 主配置。受管于 dots（tree/home/.kimi-code/config.toml → ~/.kimi-code/config.toml）。
# 注意：/login 等流程会原地回写本文件（oauth 节），改动会回流仓库——这是要的行为。
# providers/models/services 节由登录与模型目录刷新维护，别手改；.permission/.hooks 是人手区。

default_model = "kimi-code/k3"
default_plan_mode = false
default_permission_mode = "auto"
merge_all_available_skills = true
extra_skill_dirs = []
telemetry = false

[loop_control]
max_attempts_per_step = 3
reserved_context_size = 50000

[background]
max_running_tasks = 4
keep_alive_on_exit = false

[services.moonshot_search]
base_url = "https://api.kimi.com/coding/v1/search"
api_key = ""

[services.moonshot_search.oauth]
storage = "file"
key = "oauth/kimi-code"

[services.moonshot_fetch]
base_url = "https://api.kimi.com/coding/v1/fetch"
api_key = ""

[services.moonshot_fetch.oauth]
storage = "file"
key = "oauth/kimi-code"

[thinking]
enabled = true
effort = "high"

[providers."managed:kimi-code"]
type = "kimi"
api_key = ""
base_url = "https://api.kimi.com/coding/v1"

[providers."managed:kimi-code".oauth]
storage = "file"
key = "oauth/kimi-code"

[models."kimi-code/kimi-for-coding"]
provider = "managed:kimi-code"
model = "kimi-for-coding"
max_context_size = 262144
capabilities = [ "thinking", "always_thinking", "image_in", "video_in", "tool_use" ]
display_name = "K2.7 Coding"

[models."kimi-code/kimi-for-coding-highspeed"]
provider = "managed:kimi-code"
model = "kimi-for-coding-highspeed"
max_context_size = 262144
capabilities = [ "thinking", "always_thinking", "image_in", "video_in", "tool_use" ]
display_name = "K2.7 Coding Highspeed"

[models."kimi-code/k3"]
provider = "managed:kimi-code"
model = "k3"
max_context_size = 1048576
capabilities = [ "thinking", "always_thinking", "image_in", "video_in", "tool_use" ]
display_name = "K3"
support_efforts = [ "low", "high", "max" ]
default_effort = "high"

[models."kimi-code/k3-256k"]
provider = "managed:kimi-code"
model = "k3-256k"
max_context_size = 262144
capabilities = [ "thinking", "always_thinking", "image_in", "tool_use" ]
display_name = "K3-256k"
support_efforts = [ "low", "high", "max" ]
default_effort = "high"

# ════ 硬禁区（对齐 Claude settings.json 的 permissions.deny，先于 hook 生效）════
# 词法级判定（旗标簇/链式命令/工具偏好重定向）在下面的 agent-hook 守卫，不在这。

[[permission.rules]]
decision = "deny"
pattern = "Read(~/.ssh/**)"
reason = "敏感凭据目录"

[[permission.rules]]
decision = "deny"
pattern = "Edit(~/.ssh/**)"
reason = "敏感凭据目录"

[[permission.rules]]
decision = "deny"
pattern = "Read(~/.config/gh/hosts.yml)"
reason = "gh 凭据"

[[permission.rules]]
decision = "deny"
pattern = "Read(~/.claude/.credentials.json)"
reason = "Claude 凭据"

[[permission.rules]]
decision = "deny"
pattern = "Edit(~/.claude/.credentials.json)"
reason = "Claude 凭据"

[[permission.rules]]
decision = "deny"
pattern = "Read(~/.codex/auth.json)"
reason = "Codex 凭据"

[[permission.rules]]
decision = "deny"
pattern = "Edit(~/.codex/auth.json)"
reason = "Codex 凭据"

[[permission.rules]]
decision = "deny"
pattern = "Read(~/.kimi-code/credentials)"
reason = "Kimi 凭据"

[[permission.rules]]
decision = "deny"
pattern = "Edit(~/.kimi-code/credentials)"
reason = "Kimi 凭据"

[[permission.rules]]
decision = "deny"
pattern = "Write(~/.kimi-code/credentials)"
reason = "Kimi 凭据"

[[permission.rules]]
decision = "deny"
pattern = "Read(~/.kimi-code/oauth/**)"
reason = "Kimi OAuth 凭据"

[[permission.rules]]
decision = "deny"
pattern = "Edit(~/.kimi-code/oauth/**)"
reason = "Kimi OAuth 凭据"

[[permission.rules]]
decision = "deny"
pattern = "Read(~/.aws/**)"
reason = "AWS 凭据"

[[permission.rules]]
decision = "deny"
pattern = "Read(~/.config/gcloud/**)"
reason = "gcloud 凭据"

[[permission.rules]]
decision = "deny"
pattern = "Read(~/.kube/config)"
reason = "kubeconfig 凭据"

[[permission.rules]]
decision = "deny"
pattern = "Read(~/.docker/config.json)"
reason = "docker 凭据"

[[permission.rules]]
decision = "deny"
pattern = "Read(~/.netrc)"
reason = "netrc 凭据"

[[permission.rules]]
decision = "deny"
pattern = "Read(~/.npmrc)"
reason = "npm token"

[[permission.rules]]
decision = "deny"
pattern = "Read(~/.pypirc)"
reason = "PyPI 凭据"

[[permission.rules]]
decision = "deny"
pattern = "Read(~/.gnupg/**)"
reason = "GPG 私钥"

[[permission.rules]]
decision = "deny"
pattern = "Read(**/*.pem)"
reason = "PEM 私钥/证书"

[[permission.rules]]
decision = "deny"
pattern = "Read(~/.zsh_history)"
reason = "shell 历史可能含密钥"

[[permission.rules]]
decision = "deny"
pattern = "Read(~/.bash_history)"
reason = "shell 历史可能含密钥"

[[permission.rules]]
decision = "deny"
pattern = "Bash(sudo *)"
reason = "提权命令需用户手动执行"

[[permission.rules]]
decision = "deny"
pattern = "Bash(mkfs *)"
reason = "毁灭性命令"

[[permission.rules]]
decision = "deny"
pattern = "Bash(dd *)"
reason = "毁灭性命令"

# ════ 守卫（agent-hook kimi-pretool：共享 pretool.toml 规则，ask 降级 deny）════
# 规则源 tree/home/.agents/hooks/pretool.toml，dots sync 分发到 ~/.kimi-code/pretool.toml。
# 省略 matcher = 全量工具（对齐 Claude 的 matcher *）。引擎见 cli/crates/agent-hooks/。

[[hooks]]
event = "PreToolUse"
command = "~/.local/bin/agent-hook kimi-pretool"
timeout = 5
