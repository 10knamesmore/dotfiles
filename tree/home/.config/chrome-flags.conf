# Google Chrome 启动参数（/usr/bin/google-chrome-stable 会读取本文件，逐行透传）
# 目的：让 Chrome 通过 VA-API + NVDEC 硬件解码视频（配合 libva-nvidia-driver）。
# 这组参数来自 nvidia-vaapi-driver 的 README（Chrome 一节）。
--enable-features=AcceleratedVideoDecodeLinuxGL,VaapiOnNvidiaGPUs
--ignore-gpu-blocklist
--use-gl=angle
--use-angle=gl
--ozone-platform=wayland
# 使用系统 SDR 亮度，避免 HDR 网页偏暗；代价是关闭 Chrome 的 HDR/广色域输出。
--disable-features=WaylandWpColorManagerV1
