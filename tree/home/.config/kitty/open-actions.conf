protocol file
fragment_matches (?i)^l[1-9][0-9]*$
action launch --type=window --location=after nvim -c "execute strpart('${FRAGMENT}', 1)" -- ${FILE_PATH}

protocol file
mime text/*
fragment_matches ^[0-9]+$
action launch --type=window --location=after nvim +${FRAGMENT} -- ${FILE_PATH}

protocol file
mime text/*
action launch --type=window --location=after nvim -- ${FILE_PATH}
